# XcodeGen specification for the macOS app. The generated iOSDeveloperToolkit.xcodeproj is
# committed, so building does not require XcodeGen; regenerate after adding app targets with:
#   xcodegen generate
name: iOSDeveloperToolkit
options:
  bundleIdPrefix: io.hideouts
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Toolkit:
    path: .
targets:
  iOSDeveloperToolkit:
    type: application
    platform: macOS
    sources:
      - path: App/iOSDeveloperToolkit
    dependencies:
      - package: Toolkit
        product: ToolkitCore
      - package: Toolkit
        product: DeviceKit
      - package: Toolkit
        product: ToolkitFeatures
    settings:
      base:
        PRODUCT_NAME: iOS Developer Toolkit
        PRODUCT_MODULE_NAME: iOSDeveloperToolkitApp
        PRODUCT_BUNDLE_IDENTIFIER: io.hideouts.iOSDeveloperToolkit
        INFOPLIST_FILE: App/iOSDeveloperToolkit/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/iOSDeveloperToolkit/iOSDeveloperToolkit.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        COMBINE_HIDPI_IMAGES: YES
        ARCHS: "$(ARCHS_STANDARD)"
        ONLY_ACTIVE_ARCH[config=Debug]: YES
  iOSDeveloperToolkitUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: App/UITests
    dependencies:
      - target: iOSDeveloperToolkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.hideouts.iOSDeveloperToolkitUITests
        TEST_TARGET_NAME: iOSDeveloperToolkit
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
schemes:
  iOSDeveloperToolkit:
    build:
      targets:
        iOSDeveloperToolkit: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iOSDeveloperToolkitUITests
    archive:
      config: Release
