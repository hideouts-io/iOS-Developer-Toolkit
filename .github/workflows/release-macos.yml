name: Release macOS applications

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            python_architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
            python_architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_architecture }}
          cache: pip
      - name: Build and verify native application
        run: ./scripts/build_macos_release.sh "${GITHUB_REF_NAME#v}" release-assets python3
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.architecture }}
          path: release-assets/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "iOS Developer Toolkit $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Native Apple Silicon and Intel macOS application bundles. Both builds are ad-hoc signed and are not Apple-notarized. Verify SHA256SUMS.txt before opening."
