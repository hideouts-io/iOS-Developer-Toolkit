name: Release macOS applications

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            python_architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
            python_architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_architecture }}
          cache: pip
      - name: Build and verify native application
        run: ./scripts/build_macos_release.sh "${GITHUB_REF_NAME#v}" release-assets python3
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.architecture }}
          path: |
            release-assets/*.zip
            release-assets/*.cdx.json
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.zip *.cdx.json > SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: release-assets/*.zip
      - name: Attest Apple Silicon SBOM
        uses: actions/attest@v4.2.2
        with:
          subject-path: release-assets/iOS-Developer-Toolkit-${{ github.ref_name }}-macOS-arm64.zip
          sbom-path: release-assets/iOS-Developer-Toolkit-${{ github.ref_name }}-macOS-arm64.cdx.json
      - name: Attest Intel SBOM
        uses: actions/attest@v4.2.2
        with:
          subject-path: release-assets/iOS-Developer-Toolkit-${{ github.ref_name }}-macOS-x86_64.zip
          sbom-path: release-assets/iOS-Developer-Toolkit-${{ github.ref_name }}-macOS-x86_64.cdx.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "iOS Developer Toolkit $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Native Apple Silicon and Intel macOS application bundles with CycloneDX SBOMs and GitHub build-provenance/SBOM attestations. Both builds are ad-hoc signed and are not Apple-notarized. Verify SHA256SUMS.txt and the GitHub attestation before opening."
