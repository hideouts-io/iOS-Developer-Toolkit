name: Feature request
description: Propose a focused developer, diagnostic, backup, or evidence workflow.
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and read the README.
          required: true
        - label: The request is for authorized device development, diagnostics, administration, backup, or evidence preservation.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need without prescribing an implementation.
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Desired guided workflow
      description: Explain the minimum inputs, action, output, and cleanup behavior.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Device connection and trust
        - Developer Mode or developer services
        - Readiness Check
        - Actions, Advanced Mode, or Tool Reference
        - Live Logs or packet capture
        - Location Lab
        - Apps or app installation
        - Backup
        - Evidence Capture
        - Simulators
        - External tools (MVT, UFADE, idb)
        - idt command-line tool
        - Packaging or release
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: upstream
    attributes:
      label: Upstream command or documentation
      description: Link Apple documentation (for example devicectl, simctl, or xctrace help) when the request depends on a specific service or tool.

  - type: textarea
    id: safety
    attributes:
      label: Safety, privacy, and cleanup considerations
      description: Identify mutations, sensitive output, device-version limits, and how the action should be stopped or reversed.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
