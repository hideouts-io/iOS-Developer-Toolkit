name: Bug report
description: Report a reproducible problem with the app or idt.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve iOS Developer Toolkit. Remove UDIDs, serial numbers, device names, account data, coordinates, backup contents, packet payloads, and evidence before posting.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      options:
        - label: I am using a device and data I own or am explicitly authorized to test.
          required: true
        - label: I searched existing issues and tested the latest release or current main branch.
          required: true
        - label: I removed private device, account, location, network, backup, and evidence data.
          required: true

  - type: input
    id: toolkit-version
    attributes:
      label: Toolkit version
      description: From iOS Developer Toolkit › About, or a commit SHA.
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation type
      options:
        - Release download
        - Built from source (Xcode)
        - idt command-line tool
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Mac, macOS, and Xcode
      description: Mac architecture, macOS version, and Xcode version (or "no Xcode").
      placeholder: Apple silicon, macOS 26.3, Xcode 26.1
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device or simulator and iOS/iPadOS version
      description: Product family and OS version only. No UDID, serial number, phone number, or device name.
      placeholder: iPhone 16 family, iOS 26.3.1
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - USB, trusted and unlocked
        - USB, not trusted yet
        - Wi-Fi sync or network (Xcode pairing)
        - Simulator
        - Demo Mode / no device
        - Other or unknown
    validations:
      required: true

  - type: input
    id: workspace
    attributes:
      label: Page, action, or command
      placeholder: Live Logs / Unified, or idt collect
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect and select the device
        2. Open ...
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and message
      description: The message shown, plus the technical details from Help › Diagnostic Log with private data removed. Do not attach backups, captures, sysdiagnose archives, or evidence.
    validations:
      required: true

  - type: textarea
    id: readiness
    attributes:
      label: Readiness Check result
      description: The rows that are not ready, with their explanation.

  - type: textarea
    id: additional
    attributes:
      label: Additional sanitized context
      description: Screenshots only if they contain no identifiers or evidence (Demo Mode or a simulator is ideal).
