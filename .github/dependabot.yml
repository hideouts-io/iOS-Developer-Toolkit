version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      official-actions:
        patterns:
          - "actions/*"
          - "github/codeql-action"
    labels:
      - dependencies
    open-pull-requests-limit: 5
